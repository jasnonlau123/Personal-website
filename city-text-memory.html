<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>城市文字记忆 | Liu YongKai</title>
    <meta name="description" content="Liu YongKai 的城市文字记忆项目，以动态档案堆叠展示城市文字样本。" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="brand-identity.css" />
    <link rel="stylesheet" href="city-memory.css" />
  </head>
  <body class="project-detail-page city-memory-page">
    <header class="site-header">
      <a class="brand" href="index.html#home" aria-label="回到首页">LYK</a>
      <nav class="nav-links" aria-label="主要导航">
        <a href="index.html#about">关于</a>
        <a class="active" href="index.html#culture">传播</a>
        <a href="index.html#design">项目</a>
        <a href="index.html#research">研究</a>
        <a href="index.html#contact">合作</a>
      </nav>
      <div class="header-meta">
        <span>山东 济南</span>
        <a class="language-button detail-home-link" href="index.html#culture">返回</a>
      </div>
    </header>

    <main>
      <section class="memory-section" aria-labelledby="gallery-title">
        <div class="gallery-heading memory-heading">
          <div>
            <span class="detail-kicker">Archive</span>
            <h2 id="gallery-title">城市文字记忆</h2>
          </div>
          <p>拖拽浏览城市文字样本，点击居中图片查看拍摄时间、地点与背景。后续可替换为你的真实项目资料。</p>
        </div>

        <div class="memory-stage" id="memory-stage">
          <div id="circular-gallery" class="circular-gallery" aria-label="城市文字记忆循环画廊"></div>
        </div>

        <dialog class="memory-detail-dialog" id="memory-detail-dialog" aria-labelledby="memory-detail-title">
          <button class="memory-dialog-close" id="memory-dialog-close" type="button" aria-label="关闭图片信息">×</button>
          <div class="memory-detail-layout">
            <figure class="memory-detail-media">
              <img id="memory-detail-image" src="" alt="" />
            </figure>
            <article class="memory-detail-copy">
              <span class="detail-kicker">Text Memory</span>
              <h3 id="memory-detail-title">城市文字样本</h3>
              <dl class="memory-detail-meta">
                <div>
                  <dt>拍摄时间</dt>
                  <dd id="memory-detail-date">待补充</dd>
                </div>
                <div>
                  <dt>拍摄地点</dt>
                  <dd id="memory-detail-location">待补充</dd>
                </div>
              </dl>
              <div class="memory-detail-background">
                <span>拍摄背景</span>
                <p id="memory-detail-background">待补充</p>
              </div>
            </article>
          </div>
        </dialog>
      </section>

      <section class="graphic-memory-section" aria-labelledby="graphic-memory-title">
        <div class="gallery-heading memory-heading">
          <div>
            <span class="detail-kicker">Graphic Archive</span>
            <h2 id="graphic-memory-title">城市图形记忆</h2>
          </div>
          <p>记录城市中的图案、符号、公共标识、墙面纹理与空间图形。后续可继续加入你的城市观察与设计转译。</p>
        </div>

        <div class="graphic-memory-grid">
          <article class="graphic-memory-card">
            <span>01</span>
            <h3>公共符号</h3>
            <p>街区中的导视、告示与公共图形。</p>
          </article>
          <article class="graphic-memory-card">
            <span>02</span>
            <h3>墙面纹理</h3>
            <p>旧墙、涂层、痕迹和时间肌理。</p>
          </article>
          <article class="graphic-memory-card">
            <span>03</span>
            <h3>街道图案</h3>
            <p>铺装、门面、橱窗与城市节奏。</p>
          </article>
        </div>
      </section>
    </main>

    <script src="city-memory.js"></script>
  </body>
</html>
